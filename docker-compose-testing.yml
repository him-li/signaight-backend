version: '3.6'

services:
  redis:
    image: redis:6.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file: .env_testing   

  be-tests:
    image: signaight-testing:latest
    restart: no
    env_file: .env_testing
    depends_on:
      - redis

